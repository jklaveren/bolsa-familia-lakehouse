name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (necessario para PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: python -m pytest tests/ -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validar infra local
        run: terraform -chdir=infra init -backend=false && terraform -chdir=infra validate

      - name: Validar infra Azure (sem apply)
        run: terraform -chdir=infra/azure init -backend=false && terraform -chdir=infra/azure validate

      - name: Validar job do Databricks Workflows (sem apply)
        run: terraform -chdir=infra/databricks init -backend=false && terraform -chdir=infra/databricks validate

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dbt-databricks
        run: pip install dbt-databricks==1.8.4

      - name: Preparar profile (sem segredos)
        working-directory: dbt/bolsa_familia
        run: cp profiles.yml.example profiles.yml

      - name: dbt deps + parse
        working-directory: dbt/bolsa_familia
        env:
          DATABRICKS_HOST: example.cloud.databricks.com
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/0000000000000000
          DATABRICKS_TOKEN: dummy
        run: dbt deps && dbt parse --profiles-dir .

  dbt-duckdb:
    # Os 13 testes rodam de verdade em toda PR: a mesma arvore de modelos
    # executa em DuckDB sobre a amostra de seeds/, sem credencial de
    # workspace. O que se prova aqui nao e' volume -- e' que as regras
    # continuam valendo: unicidade de chave, integridade referencial,
    # dominio de UF e a soma da Gold batendo com a Silver.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dbt-duckdb
        run: pip install dbt-duckdb==1.9.2

      - name: Preparar profile (sem segredos)
        working-directory: dbt/bolsa_familia
        run: cp profiles.yml.example profiles.yml

      - name: dbt seed + run + test
        working-directory: dbt/bolsa_familia
        env:
          # Aponta a source para o seed; no Databricks os padroes valem.
          DBT_SILVER_SCHEMA: main
          DBT_SILVER_TABLE: seed_pagamentos_amostra
        run: |
          dbt deps
          dbt seed  --target ci --profiles-dir .
          dbt run   --target ci --profiles-dir .
          dbt test  --target ci --profiles-dir .

  dbt-databricks:
    # Suite contra o workspace real, quando os secrets DATABRICKS_* existem.
    # Complementa o job acima: la' a regra, aqui o volume.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets do Databricks
        id: secrets
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.secrets.outputs.enabled == 'true'
        name: Instalar dbt-databricks
        run: pip install dbt-databricks==1.8.4

      - if: steps.secrets.outputs.enabled == 'true'
        name: Preparar profile (sem segredos)
        working-directory: dbt/bolsa_familia
        run: cp profiles.yml.example profiles.yml

      - if: steps.secrets.outputs.enabled == 'true'
        name: dbt run + dbt test
        working-directory: dbt/bolsa_familia
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt deps && dbt run --profiles-dir . && dbt test --profiles-dir .
