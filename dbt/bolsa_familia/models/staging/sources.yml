version: 2

sources:
  # Schema e tabela vem do ambiente para que o CI possa apontar a mesma
  # arvore de modelos para a amostra em DuckDB. Os padroes sao os valores
  # de producao no Databricks -- sem env var, nada muda.
  - name: silver
    schema: "{{ env_var('DBT_SILVER_SCHEMA', 'bolsa_familia') }}"
    tables:
      - name: pagamentos
        identifier: "{{ env_var('DBT_SILVER_TABLE', 'pagamentos') }}"
        description: >
          Tabela Delta da camada Silver — pagamentos do Novo Bolsa Familia,
          tipados, deduplicados e com NIS/nome pseudonimizados (Secao 7.2).
        columns:
          - name: mes_competencia
            description: Primeiro dia do mes de competencia do arquivo
          - name: mes_referencia
            description: Primeiro dia do mes a que a parcela se refere
          - name: uf
            description: Unidade federativa do beneficiario (2 letras)
          - name: codigo_municipio_siafi
            description: Codigo SIAFI do municipio
          - name: nome_municipio
            description: Nome do municipio
          - name: cpf_favorecido
            description: CPF ja mascarado na fonte (frequentemente vazio)
          - name: valor_parcela
            description: Valor pago na parcela, em reais (decimal 10,2)
          - name: nis_hash
            description: SHA-256(NIS + salt) — identificador pseudonimizado
